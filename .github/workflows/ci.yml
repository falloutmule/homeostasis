name: SFHS CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: game
      - uses: actions/checkout@v4
        with:
          repository: falloutmule/single-file-html-software
          ref: fc8cbd8fc5d1dbb6bf3251d62954e8558e533619
          path: sfhs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sfhs/pnpm-lock.yaml
      - name: Stage the exact game revision in the pinned SFHS workspace
        run: |
          mkdir -p sfhs/examples/homeostasis
          git -C game archive --format=tar HEAD | tar -x -C sfhs/examples/homeostasis
      - name: Install pinned workspace dependencies
        working-directory: sfhs
        run: pnpm install --no-frozen-lockfile
      - name: Inspect, validate, check, pack, and exactly verify
        working-directory: sfhs
        run: |
          pnpm sfhs inspect --json --project examples/homeostasis
          pnpm sfhs validate --json --project examples/homeostasis
          pnpm sfhs check --json --project examples/homeostasis
          pnpm sfhs pack --json --project examples/homeostasis
          pnpm sfhs verify --json --project examples/homeostasis
      - name: Exact-artifact Samsung-emulation then desktop Chromium proof
        working-directory: sfhs
        run: node examples/homeostasis/tools/run-browser-proof.mjs
      - name: Upload current browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeostasis-browser-evidence
          path: sfhs/.sfhs-evidence/homeostasis-import
          if-no-files-found: warn
          retention-days: 14
